# SPDX-License-Identifier: AGPL-3.0-or-later
# Licence and copyright of files that cannot carry a header (REUSE specification 3.3).
version = 1

[[annotations]]
path = "**"
precedence = "aggregate"
SPDX-FileCopyrightText = "falkOSS – Falcon Lake Open Source Software gUG (haftungsbeschränkt) i. G. and the librotenado contributors"
SPDX-License-Identifier = "AGPL-3.0-or-later"

# Copies of the artwork from librotenado/brand – kept as they are, under its licence.
[[annotations]]
path = ["favicon.*", "apple-touch-icon.png", "icon-*.png", "site.webmanifest", "social.png", "assets/**"]
precedence = "override"
SPDX-FileCopyrightText = "falkOSS – Falcon Lake Open Source Software gUG (haftungsbeschränkt) i. G."
SPDX-License-Identifier = "CC-BY-ND-4.0"

[[annotations]]
path = "assets/fonts/**"
precedence = "override"
SPDX-FileCopyrightText = ["2020-2024 The Atkinson Hyperlegible Next Project Authors", "2020-2024 The Atkinson Hyperlegible Mono Project Authors"]
SPDX-License-Identifier = "OFL-1.1"

# The page's text, CC BY 4.0 like the specification and the whitepaper; its markup AGPL-3.0-or-later.
[[annotations]]
path = ["index.html", "404.html"]
precedence = "override"
SPDX-FileCopyrightText = "falkOSS – Falcon Lake Open Source Software gUG (haftungsbeschränkt) i. G. and the librotenado contributors"
SPDX-License-Identifier = "AGPL-3.0-or-later AND CC-BY-4.0"

# A copy of the whitepaper from librotenado/whitepaper.
[[annotations]]
path = "librotenado-whitepaper.pdf"
precedence = "override"
SPDX-FileCopyrightText = "falkOSS – Falcon Lake Open Source Software gUG (haftungsbeschränkt) i. G. and the librotenado contributors"
SPDX-License-Identifier = "CC-BY-4.0"
